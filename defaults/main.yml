---
# Project source code URL: https://github.com/Prowlarr/Prowlarr

prowlarr_enabled: true

prowlarr_identifier: prowlarr
prowlarr_base_path: "/{{ prowlarr_identifier }}"
prowlarr_data_path: "{{ prowlarr_base_path }}/data"

# renovate: datasource=docker depName=ghcr.io/linuxserver/prowlarr versioning=semver
prowlarr_version: 2.7.0
prowlarr_arch: amd64

prowlarr_uid: ""
prowlarr_gid: ""

# The hostname at which prowlarr is served.
prowlarr_hostname: ""

# The path at which prowlarr is served.
# This value must either be `/` or not end with a slash (e.g. `/prowlarr`).
prowlarr_path_prefix: /

prowlarr_container_image: "{{ prowlarr_container_image_registry_prefix }}linuxserver/prowlarr:{{ prowlarr_container_image_tag }}"
prowlarr_container_image_tag: "{{ prowlarr_version }}"
prowlarr_container_image_registry_prefix: "{{ prowlarr_container_image_registry_prefix_upstream }}"
prowlarr_container_image_registry_prefix_upstream: "{{ prowlarr_container_image_registry_prefix_upstream_default }}"
prowlarr_container_image_registry_prefix_upstream_default: ghcr.io/

# The base container network. It will be auto-created by this role if it doesn't exist already.
prowlarr_container_network: "{{ prowlarr_identifier }}"

# Control if the container network is deleted on uninstalling.
prowlarr_container_network_deletion_enabled: true

# Specify how the container publishes its HTTP port (as defined by `prowlarr_container_http_port`).
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:2586"), or empty string to not expose.
prowlarr_container_http_host_bind_port: ""

# The port number in the container
prowlarr_container_http_port: 9696

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
# Use this to expose this container to another reverse proxy, which runs in a different container network.
prowlarr_container_additional_networks: "{{ prowlarr_container_additional_networks_auto + prowlarr_container_additional_networks_custom }}"
prowlarr_container_additional_networks_auto: []
prowlarr_container_additional_networks_custom: []

# A list of additional "volumes" to mount in the container.
# This list gets populated dynamically at runtime. You can provide a different default value,
# if you wish to mount your own files into the container.
# Contains definition objects like this: `{"type": "bind", "src": "/outside", "dst": "/inside", "options": "readonly"}.
# See the `--mount` documentation for the `docker run` command.
prowlarr_container_additional_volumes: "{{ prowlarr_container_additional_volumes_auto + prowlarr_container_additional_volumes_custom }}"
prowlarr_container_additional_volumes_auto: []
prowlarr_container_additional_volumes_custom: []

# prowlarr_container_labels_traefik_enabled controls whether labels to assist a Traefik reverse-proxy will be attached to the container.
# See `../templates/labels.j2` for details.
#
# To inject your own other container labels, see `prowlarr_container_labels_additional_labels_custom`.
prowlarr_container_labels_traefik_enabled: true
prowlarr_container_labels_traefik_docker_network: "{{ prowlarr_container_network }}"
prowlarr_container_labels_traefik_hostname: "{{ prowlarr_hostname }}"
# The path prefix must either be `/` or not end with a slash (e.g. `/prowlarr`).
prowlarr_container_labels_traefik_path_prefix: "{{ prowlarr_path_prefix }}"
prowlarr_container_labels_traefik_rule: "Host(`{{ prowlarr_container_labels_traefik_hostname }}`){% if prowlarr_container_labels_traefik_path_prefix != '/' %} && PathPrefix(`{{ prowlarr_container_labels_traefik_path_prefix }}`){% endif %}"
prowlarr_container_labels_traefik_priority: 0
prowlarr_container_labels_traefik_entrypoints: web-secure
prowlarr_container_labels_traefik_tls: "{{ prowlarr_container_labels_traefik_entrypoints != 'web' }}"
prowlarr_container_labels_traefik_tls_certResolver: default  # noqa var-naming
prowlarr_container_labels_traefik_middleware_basic_auth_enabled: false
# See: https://doc.traefik.io/traefik/reference/routing-configuration/http/middlewares/basicauth/
prowlarr_container_labels_traefik_middleware_basic_auth_users: ""

# Controls which additional headers to attach to all HTTP requests.
# To add your own custom request headers, use `prowlarr_container_labels_traefik_additional_request_headers_custom`
prowlarr_container_labels_traefik_additional_request_headers: "{{ prowlarr_container_labels_traefik_additional_request_headers_auto | combine(prowlarr_container_labels_traefik_additional_request_headers_custom) }}"
prowlarr_container_labels_traefik_additional_request_headers_auto: {}
prowlarr_container_labels_traefik_additional_request_headers_custom: {}

# Controls which additional headers to attach to all HTTP responses.
# To add your own custom response headers, use `prowlarr_container_labels_traefik_additional_response_headers_custom`
prowlarr_container_labels_traefik_additional_response_headers: "{{ prowlarr_container_labels_traefik_additional_response_headers_auto | combine(prowlarr_container_labels_traefik_additional_response_headers_custom) }}"
prowlarr_container_labels_traefik_additional_response_headers_auto: |
  {{
    {}
    | combine ({'X-XSS-Protection': prowlarr_http_header_xss_protection} if prowlarr_http_header_xss_protection else {})
    | combine ({'X-Content-Type-Options': prowlarr_http_header_content_type_options} if prowlarr_http_header_content_type_options else {})
    | combine ({'Content-Security-Policy': prowlarr_http_header_content_security_policy} if prowlarr_http_header_content_security_policy else {})
    | combine ({'Permissions-Policy': prowlarr_http_header_permissions_policy} if prowlarr_http_header_permissions_policy else {})
    | combine ({'Strict-Transport-Security': prowlarr_http_header_strict_transport_security} if prowlarr_http_header_strict_transport_security and prowlarr_container_labels_traefik_tls else {})
  }}
prowlarr_container_labels_traefik_additional_response_headers_custom: {}

# prowlarr_container_labels_additional_labels contains a multiline string with additional labels to add to the container label file.
# See `../templates/labels.j2` for details.
# To add your own custom labels, use `prowlarr_container_labels_additional_labels_custom`
#
# Example:
# prowlarr_container_labels_additional_labels_custom:
#   - my.label=1
#   - another.label="here"
prowlarr_container_labels_additional_labels: "{{ prowlarr_container_labels_additional_labels_auto + prowlarr_container_labels_additional_labels_custom }}"
prowlarr_container_labels_additional_labels_auto: []
prowlarr_container_labels_additional_labels_custom: []

# Specify the size of the container's tmpfs volume (/run)
prowlarr_container_tmpfs_run_size: 128m

# A list of extra arguments to pass to the container (`docker create` command)
prowlarr_container_extra_arguments: "{{ prowlarr_container_extra_arguments_auto + prowlarr_container_extra_arguments_custom }}"
prowlarr_container_extra_arguments_auto: []
prowlarr_container_extra_arguments_custom: []

# A list of extra arguments to pass to the process inside the container
# Example: ['--SOME_ARGUMENT']
prowlarr_process_extra_arguments: "{{ prowlarr_process_extra_arguments_auto + prowlarr_process_extra_arguments_custom }}"
prowlarr_process_extra_arguments_auto: []
prowlarr_process_extra_arguments_custom: []

# Specifies the value of the `X-XSS-Protection` header
# Stops pages from loading when they detect reflected cross-site scripting (XSS) attacks.
#
# Learn more about it is here:
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-XSS-Protection
# - https://portswigger.net/web-security/cross-site-scripting/reflected
prowlarr_http_header_xss_protection: "1; mode=block"

# Specifies the value of the `X-Content-Type-Options` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Content-Type-Options
prowlarr_http_header_content_type_options: nosniff

# Specifies the value of the `Content-Security-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy
prowlarr_http_header_content_security_policy: frame-ancestors 'self'

# Specifies the value of the `Permissions-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Permissions-Policy
prowlarr_http_header_permissions_policy: "{{ 'interest-cohort=()' if prowlarr_floc_optout_enabled else '' }}"

# Specifies the value of the `Strict-Transport-Security` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
prowlarr_http_header_strict_transport_security: "max-age=31536000; includeSubDomains{{ '; preload' if prowlarr_hsts_preload_enabled else '' }}"

# Controls whether to send a "Permissions-Policy interest-cohort=();" header along with all responses
#
# Learn more about what it is here:
# - https://www.eff.org/deeplinks/2021/03/googles-floc-terrible-idea
# - https://paramdeo.com/blog/opting-your-website-out-of-googles-floc-network
# - https://amifloced.org/
#
# Of course, a better solution is to just stop using browsers (like Chrome), which participate in such tracking practices.
# See: `prowlarr_http_header_permissions_policy`
prowlarr_floc_optout_enabled: true

# Controls if HSTS preloading is enabled
#
# In its strongest and recommended form, the [HSTS policy](https://www.chromium.org/hsts) includes all subdomains, and
# indicates a willingness to be "preloaded" into browsers:
# `Strict-Transport-Security: max-age=31536000; includeSubDomains; preload`
# For more information visit:
# - https://en.wikipedia.org/wiki/HTTP_Strict_Transport_Security
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
# - https://hstspreload.org/#opt-in
# See: `prowlarr_http_header_strict_transport_security`
prowlarr_hsts_preload_enabled: false

# List of systemd services that the Prowlarr systemd service depends on
prowlarr_systemd_required_services_list: "{{ prowlarr_systemd_required_services_list_default + prowlarr_systemd_required_services_list_auto + prowlarr_systemd_required_services_list_custom }}"
prowlarr_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"
prowlarr_systemd_required_services_list_auto: []
prowlarr_systemd_required_services_list_custom: []

# List of systemd services that the Prowlarr systemd service wants
prowlarr_systemd_wanted_services_list: "{{ prowlarr_systemd_wanted_services_list_default + prowlarr_systemd_wanted_services_list_auto + prowlarr_systemd_wanted_services_list_custom }}"
prowlarr_systemd_wanted_services_list_default: []
prowlarr_systemd_wanted_services_list_auto: []
prowlarr_systemd_wanted_services_list_custom: []

# Controls how long to wait for the container to stop gracefully before killing it.
prowlarr_container_stop_grace_time_seconds: "{{ devture_systemd_docker_base_container_stop_grace_time_seconds }}"

# Controls how long the pre-start cleanup should wait for stale container-name release
# before failing startup explicitly.
prowlarr_container_cleanup_timeout_seconds: "{{ devture_systemd_docker_base_container_cleanup_timeout_seconds }}"

# Controls the delay between pre-start cleanup retries.
prowlarr_container_cleanup_retry_delay_seconds: "{{ devture_systemd_docker_base_container_cleanup_retry_delay_seconds }}"

# Shell command used in the systemd pre-start phase to deterministically remove a stale
# container and wait until Docker releases its name.
prowlarr_container_cleanup_command: |
  i=0;
  while [ "$i" -lt {{ prowlarr_container_cleanup_timeout_seconds }} ]; do
  {{ devture_systemd_docker_base_host_command_docker }} stop -t {{ prowlarr_container_stop_grace_time_seconds }} {{ prowlarr_identifier }} >/dev/null 2>&1 || true;
  {{ devture_systemd_docker_base_host_command_docker }} rm -f {{ prowlarr_identifier }} >/dev/null 2>&1 || true;
  if {{ devture_systemd_docker_base_host_command_docker }} container inspect {{ prowlarr_identifier }} >/dev/null 2>&1; then
  i=$((i + 1));
  sleep {{ prowlarr_container_cleanup_retry_delay_seconds }};
  continue;
  fi;
  if {{ devture_systemd_docker_base_host_command_docker }} info >/dev/null 2>&1; then
  exit 0;
  fi;
  echo "Failed to query Docker daemon while cleaning up {{ prowlarr_identifier }}" >&2;
  exit 1;
  done;
  echo "Failed to remove stale container {{ prowlarr_identifier }} after {{ prowlarr_container_cleanup_timeout_seconds }} attempts" >&2;
  exit 1

# Specify the timezone
prowlarr_environment_variables_tz: "Etc/UTC"

# Additional environment variables.
prowlarr_environment_variables_additional_variables: ""

# prowlarr_restart_necessary controls whether the Prowlarr systemd
# service will be restarted (when true) or merely started (when false) by the
# systemd service manager role (when conditional restart is enabled).
#
# This value is automatically computed during installation based on whether
# any configuration files, the systemd service file, or the container image changed.
# The default of `false` means "no restart needed" — appropriate when the role's
# installation tasks haven't run (e.g., due to --tags skipping them).
prowlarr_restart_necessary: false
