---
- name: Perform Prowlarr installation tasks
  when: prowlarr_enabled | bool
  tags:
    - setup-all
    - setup-prowlarr
    - install-all
    - install-prowlarr
  block:
    - name: Validate Prowlarr configuration
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/validate_config.yml"
    - name: Install Prowlarr
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/install.yml"

- name: Perform Prowlarr uninstallation tasks
  when: not prowlarr_enabled | bool
  tags:
    - setup-all
    - setup-prowlarr
  block:
    - name: Uninstall Prowlarr
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/uninstall.yml"
