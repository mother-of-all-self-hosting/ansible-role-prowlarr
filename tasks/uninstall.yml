---
- name: Check existence of Prowlarr systemd service
  ansible.builtin.stat:
    path: "{{ devture_systemd_docker_base_systemd_path }}/{{ prowlarr_identifier }}.service"
  register: prowlarr_service_stat

- name: Uninstall Prowlarr systemd services and files
  when: prowlarr_service_stat.stat.exists | bool
  block:
    - name: Ensure Prowlarr systemd service is stopped
      ansible.builtin.service:
        name: "{{ prowlarr_identifier }}"
        state: stopped
        enabled: false
        daemon_reload: true

    - name: Ensure Prowlarr systemd service does not exist
      ansible.builtin.file:
        path: "{{ devture_systemd_docker_base_systemd_path }}/{{ prowlarr_identifier }}.service"
        state: absent

    - name: Ensure Prowlarr support files do not exist
      ansible.builtin.file:
        path: "{{ prowlarr_base_path }}/{{ item }}"
        state: absent
      with_items:
        - env
        - labels

    - name: Ensure Prowlarr local data path does not exist if empty
      ansible.builtin.command:
        cmd: "rmdir {{ prowlarr_data_path }}"
      register: prowlarr_data_path_deletion_result
      changed_when: prowlarr_data_path_deletion_result.rc == 0
      failed_when: false

    - name: Ensure Prowlarr base path does not exist if empty
      ansible.builtin.command:
        cmd: "rmdir {{ prowlarr_base_path }}"
      register: prowlarr_base_path_deletion_result
      changed_when: prowlarr_base_path_deletion_result.rc == 0
      failed_when: false

    - name: Ensure Prowlarr container network does not exist
      when: prowlarr_container_network_deletion_enabled
      block:
        - name: Ensure Prowlarr container network does not exist via community.docker.docker_network
          when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
          community.docker.docker_network:
            name: "{{ prowlarr_container_network }}"
            state: absent
          register: prowlarr_network_deletion_result

        - name: Ensure Prowlarr container network does not exist via ansible.builtin.command
          when: devture_systemd_docker_base_container_network_creation_method == 'command'
          ansible.builtin.command:
            cmd: >-
              {{ devture_systemd_docker_base_host_command_docker }} network rm
              {{ prowlarr_container_network }}
          register: prowlarr_network_deletion_result
          changed_when: prowlarr_container_network in prowlarr_network_deletion_result.stdout

- name: Check existence of Prowlarr local data path
  ansible.builtin.stat:
    path: "{{ prowlarr_data_path }}"
  register: prowlarr_data_path_stat

# We just want to notify the user. Deleting data is too destructive.
- name: Inject the message about the remaining Prowlarr local data path
  when: prowlarr_data_path_stat.stat.exists | bool
  ansible.builtin.set_fact:
    devture_playbook_runtime_messages_list: |
      {{
        devture_playbook_runtime_messages_list | default([])
        +
        [
          "Note: As the local Prowlarr instance has been removed, some old data remains in `" + prowlarr_data_path + "`. Feel free to delete it."
        ]
      }}
