---
- name: Fail if required Prowlarr settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`).
  when: "lookup('vars', item, default='') | string | length == 0"
  with_items:
    - prowlarr_uid
    - prowlarr_gid
    - prowlarr_hostname

- name: Fail if Prowlarr architecture is not supported
  ansible.builtin.fail:
    msg: >-
      Your configuration specifies a CPU architecture (`{{ prowlarr_arch }}`) which is not currently supported.
      This Prowlarr role also does not support self-building yet, so it's not possible to make use of it.
  when: "prowlarr_arch not in ['amd64', 'arm64']"

- name: Validate Prowlarr Traefik configuration
  when: prowlarr_container_labels_traefik_enabled | bool
  block:
    - name: Fail if required Prowlarr Traefik settings not defined
      ansible.builtin.fail:
        msg: >-
          You need to define a required configuration setting (`{{ item.name }}`).
      when: "item.when | bool and lookup('vars', item.name, default='') | string | length == 0"
      with_items:
        - { "name": "prowlarr_container_labels_traefik_hostname", when: true }
        - { "name": "prowlarr_container_labels_traefik_path_prefix", when: true }
        - { "name": "prowlarr_container_labels_traefik_middleware_basic_auth_users", when: "{{ prowlarr_container_labels_traefik_middleware_basic_auth_enabled }}" }

    # We ensure it doesn't end with a slash, because we handle both (slash and no-slash).
    # Knowing that `prowlarr_container_labels_traefik_path_prefix` does not end with a slash
    # ensures we know how to set these routes up without having to do "does it end with a slash" checks elsewhere.
    - name: Fail if prowlarr_container_labels_traefik_path_prefix ends with a slash
      ansible.builtin.fail:
        msg: >-
          prowlarr_container_labels_traefik_path_prefix (`{{ prowlarr_container_labels_traefik_path_prefix }}`) must either be `/` or not end with a slash (e.g. `/prowlarr`).
      when: "prowlarr_container_labels_traefik_path_prefix != '/' and prowlarr_container_labels_traefik_path_prefix[-1] == '/'"
